<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#1E293B" />
  
  <!-- Video Camera Shape -->
  <path d="M50 70 L120 70 L120 130 L50 130 L50 70 Z" 
        fill="#3B82F6" 
        stroke="#60A5FA" 
        stroke-width="4"/>
  
  <!-- Camera Lens -->
  <circle cx="85" cy="100" r="20" 
          fill="#1E293B" 
          stroke="#60A5FA" 
          stroke-width="4"/>
  
  <!-- Video Light Indicator -->
  <circle cx="85" cy="100" r="8" fill="#60A5FA"/>
  
  <!-- Video Signal Lines -->
  <path d="M120 85 L150 70 L150 130 L120 115" 
        fill="#3B82F6" 
        stroke="#60A5FA" 
        stroke-width="4"/>
  
  <!-- Connection Lines -->
  <path d="M30 90 L40 90" stroke="#60A5FA" stroke-width="4"/>
  <path d="M30 100 L40 100" stroke="#60A5FA" stroke-width="4"/>
  <path d="M30 110 L40 110" stroke="#60A5FA" stroke-width="4"/>
</svg>